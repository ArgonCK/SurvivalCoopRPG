<title>Cinder Isle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">

<div id="app">
  <header id="topbar"></header>
  <div id="objectives"></div>
  <main id="layout">
    <section id="map-panel" class="panel"></section>
    <section id="center-panel">
      <div id="area-wrap"></div>
      <div class="panel" style="margin-top:12px">
        <h2>Radio log</h2>
        <div id="log" data-keep-scroll></div>
      </div>
    </section>
    <aside id="side-panel">
      <div class="panel" id="party-panel"></div>
      <div class="panel" id="pack-panel" style="margin-top:12px"></div>
      <div class="panel" id="craft-panel" style="margin-top:12px"></div>
    </aside>
  </main>
</div>
<div id="overlay" hidden></div>

<script type="module" src="js/main.js"></script>
